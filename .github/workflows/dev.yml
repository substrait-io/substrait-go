# SPDX-License-Identifier: Apache-2.0

name: PR Build Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  golangci:
    name: Code Linting (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
      # golangci-lint analyzes one module per run
      - name: golangci-lint (codec)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: codec
  proto-isolation:
    name: Proto Isolation (#280)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: substrait-protobuf must stay in wire/
        # Core domain packages must not reach substrait-protobuf, directly or
        # transitively, so a consumer that only builds and inspects plans does
        # not pull the generated types into its dependency graph. All encode and
        # decode lives in wire/ (issue #280).
        run: |
          set -euo pipefail
          proto='github.com/substrait-io/substrait-protobuf'
          non_wire=$(go list ./... | grep -v '/wire')
          fail=0
          if go list -deps $non_wire 2>/dev/null | grep -q "$proto"; then
            echo "substrait-protobuf reachable from a non-wire package:"
            for pkg in $non_wire; do
              go list -deps "$pkg" 2>/dev/null | grep -q "$proto" && echo "  $pkg"
            done
            fail=1
          fi
          if leaks=$(git grep -l "$proto" -- '*.go' ':(exclude)wire/' ':(exclude)codec/'); then
            echo "substrait-protobuf referenced in source outside wire/:"
            echo "$leaks" | sed 's/^/  /'
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo
            echo "substrait-protobuf must live only in wire/ (issue #280)."
            exit 1
          fi
          echo "OK: substrait-protobuf is isolated to wire/"
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install go
        uses: actions/setup-go@v3
        with:
          go-version: '>=1.18'
          cache: true
      - name: Build
        run: go build ./...
      - name: Run Tests
        if: runner.os != 'Linux'
        run: go test -v ./...
      - name: Run Tests with Coverage
        if: runner.os == 'Linux'
        run: go test -v -coverpkg=./... -coverprofile=coverage.out $(go list ./... | grep -v /proto)
      # neither go build ./... nor go test ./... descends into a nested module
      - name: Build codec
        run: go build ./...
        working-directory: codec
      - name: Run codec Tests
        if: runner.os != 'Linux'
        run: go test -v ./...
        working-directory: codec
      - name: Run codec Tests with Coverage
        if: runner.os == 'Linux'
        run: go test -v -coverprofile=codec-coverage.out ./...
        working-directory: codec
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && github.repository == 'substrait-io/substrait-go'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: ./coverage.out,./codec/codec-coverage.out
          fail_ci_if_error: true
          codecov_yml_path: .codecov.yml
