# SPDX-License-Identifier: Apache-2.0

name: PR Build Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  golangci:
    name: Code Linting (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
      # golangci-lint analyzes one module per run
      - name: golangci-lint (codec)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: codec
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install go
        uses: actions/setup-go@v3
        with:
          go-version: '>=1.18'
          cache: true
      - name: Build
        run: go build ./...
      - name: Run Tests
        if: runner.os != 'Linux'
        run: go test -v ./...
      - name: Run Tests with Coverage
        if: runner.os == 'Linux'
        run: go test -v -coverprofile=coverage.out $(go list ./... | grep -v /proto)
      # neither go build ./... nor go test ./... descends into a nested module
      - name: Build codec
        run: go build ./...
        working-directory: codec
      - name: Run codec Tests
        if: runner.os != 'Linux'
        run: go test -v ./...
        working-directory: codec
      # -coverpkg reaches the core, since codec's tests exercise core conversions that the core's
      # own suite no longer covers. Without it those statements are instrumented by neither module.
      - name: Run codec Tests with Coverage
        if: runner.os == 'Linux'
        run: go test -v -coverprofile=codec-coverage.out -coverpkg=./...,github.com/substrait-io/substrait-go/v8/... ./...
        working-directory: codec
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && github.repository == 'substrait-io/substrait-go'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: ./coverage.out,./codec/codec-coverage.out
          fail_ci_if_error: true
          codecov_yml_path: .codecov.yml
