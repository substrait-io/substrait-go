# SPDX-License-Identifier: Apache-2.0

name: PR Build Check

on: [push, pull_request]

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  golangci:
    name: Code Linting (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: 2.1.6
      # Update this when changing GOLANGCI_LINT_VERSION.
      GOLANGCI_LINT_SCHEMA_SHA256: f960a2a4ee9c11bc93211a7c10b62da81b969ce86b1b2d1676a04e8462dcca6c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      # Verify both configs with the pinned schema below instead of the action's single-shot fetch.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          verify: false
      # golangci-lint analyzes one module per run
      - name: golangci-lint (codec)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          verify: false
          working-directory: encoding/substraitproto
      - name: Verify golangci-lint configuration
        run: |
          set -euo pipefail
          schema_file="$(mktemp)"
          trap 'rm "$schema_file"' EXIT

          curl --fail --silent --show-error --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-max-time 60 \
            --connect-timeout 10 \
            --max-time 30 \
            "https://raw.githubusercontent.com/golangci/golangci-lint/v${GOLANGCI_LINT_VERSION}/jsonschema/golangci.jsonschema.json" \
            --output "$schema_file"

          if ! printf '%s  %s\n' "$GOLANGCI_LINT_SCHEMA_SHA256" "$schema_file" | sha256sum --check --status; then
            echo "golangci-lint schema checksum mismatch for v${GOLANGCI_LINT_VERSION}" >&2
            exit 1
          fi

          schema_url="file://${schema_file}"
          golangci-lint config verify --schema="$schema_url"
          (
            cd encoding/substraitproto
            golangci-lint config verify --schema="$schema_url"
          )
  proto-isolation:
    name: Proto Isolation (#280)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: substrait-protobuf must stay in codec/
        # Keep substrait-protobuf out of core's dependency graph so core-only
        # consumers don't pull in the generated protobuf types (#280).
        run: |
          set -euo pipefail
          if go mod graph | grep -Fq 'github.com/substrait-io/substrait-protobuf'; then
            echo "Core must not depend on substrait-protobuf (#280)."
            exit 1
          fi
          echo "OK: substrait-protobuf is isolated to the codec module"
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install go
        uses: actions/setup-go@v3
        with:
          go-version: '>=1.18'
          cache: true
      - name: Build
        run: go build ./...
      - name: Run Tests
        if: runner.os != 'Linux'
        run: go test -v ./...
      - name: Run Tests with Coverage
        if: runner.os == 'Linux'
        run: go test -v -coverpkg=./... -coverprofile=coverage.out $(go list ./... | grep -v /proto)
      # neither go build ./... nor go test ./... descends into a nested module
      - name: Build codec
        run: go build ./...
        working-directory: encoding/substraitproto
      - name: Run codec Tests
        if: runner.os != 'Linux'
        run: go test -v ./...
        working-directory: encoding/substraitproto
      - name: Run codec Tests with Coverage
        if: runner.os == 'Linux'
        run: go test -v -coverpkg=github.com/substrait-io/substrait-go/v9/...,github.com/substrait-io/substrait-go/encoding/substraitproto/... -coverprofile=codec-coverage.out ./...
        working-directory: encoding/substraitproto
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && github.repository == 'substrait-io/substrait-go'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: ./coverage.out,./encoding/substraitproto/codec-coverage.out
          fail_ci_if_error: true
          codecov_yml_path: .codecov.yml
