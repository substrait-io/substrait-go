name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases and never cancel an in-progress publication.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'substrait-io/substrait-go' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare or publish releases
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
