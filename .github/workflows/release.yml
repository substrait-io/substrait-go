name: Release

on:
  pull_request:    
  # Uncomment to enable scheduled releases.
  # schedule:
  #   # 2 AM on Sunday
  #   - cron: "0 2 * * 0"
  workflow_dispatch:

# we do not want more than one release workflow executing at the same time, ever
concurrency:
  group: release
  # cancelling in the middle of a release would create incomplete releases
  # so cancel-in-progress is false
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  id-token: write
  statuses: write

jobs:
  release:
    if: github.repository == 'substrait-io/substrait-go'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:          
          fetch-depth: 0
      - name: Run go-semantic-release  
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}         
        run: |          
          wget https://github.com/Nightapes/go-semantic-release/releases/download/v2.1.1/go-semantic-release.linux_x86_64.zip
          unzip go-semantic-release.linux_x86_64.zip
          ./go-semantic-release.linux_x86_64 release -l trace
      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Release codec
        # codec is versioned in lockstep with core: tag codec/vX.Y.Z for the core
        # vX.Y.Z just released. RELEASE_VERSION comes from the go-semantic-release
        # preRelease hook (check-module-version.sh); empty means no core release this
        # run, so there is nothing to tag. A re-run of the workflow will not re-tag
        # (no new core release), so a stuck codec tag is fixed by running
        # scripts/release-codec.sh by hand; it is a no-op if the tag already exists.
        run: |
          if [ -z "${RELEASE_VERSION:-}" ]; then
            echo "no core release this run; nothing to tag for codec"
            exit 0
          fi
          version="v${RELEASE_VERSION#v}"
          # stable releases only; codec is not tagged for prereleases
          case "$version" in
            *-*) echo "prerelease $version; nothing to tag for codec"; exit 0 ;;
          esac
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/release-codec.sh "$version"
          git push origin "codec/$version"
